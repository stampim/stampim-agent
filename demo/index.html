<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Гранит — склад и заявки</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">Г</span>
    <span class="brand-text">Гранит <span class="brand-sub">склад и заявки</span></span>
  </div>
  <nav class="tabs">
    <button class="tab is-active" data-screen="requests">Заявки</button>
    <button class="tab" data-screen="stock">Склад</button>
  </nav>
  <div class="userbox">
    <span class="user-name" id="user-name">Анна Соколова · менеджер</span>
    <label class="role-label"><span id="role-label-text">Роль</span>
      <select id="role-select">
        <option value="manager">Менеджер</option>
        <option value="storekeeper">Кладовщик</option>
      </select>
    </label>
  </div>
</header>

<main class="content">
  <section id="screen-requests" class="screen is-active">
    <div class="screen-head">
      <h1 id="requests-title">Заявки клиентов</h1>
      <span class="updated" id="requests-updated">Обновлено сегодня, 10:24</span>
    </div>
    <div class="metrics">
      <div class="metric"><span class="metric-num">8</span><span class="metric-label" data-metric="open">открытых заявок</span></div>
      <div class="metric metric-warn"><span class="metric-num">2</span><span class="metric-label" data-metric="overdue">просрочено</span></div>
      <div class="metric"><span class="metric-num">3</span><span class="metric-label" data-metric="high">высокий приоритет</span></div>
    </div>
    <div class="table-wrap">
      <table class="req-table">
        <thead>
          <tr>
            <th>№</th><th data-th="client">Клиент</th><th data-th="item">Позиция</th><th class="num" data-th="qty">Кол-во</th>
            <th data-th="status">Статус</th><th data-th="priority">Приоритет</th><th data-th="due">Срок</th><th class="num sum-col" data-th="sum">Сумма</th>
          </tr>
        </thead>
        <tbody id="req-body"></tbody>
      </table>
    </div>
  </section>

  <section id="screen-stock" class="screen">
    <div class="screen-head">
      <h1 id="stock-title">Склад</h1>
      <span class="updated" id="stock-updated">Остатки по региону «Север»</span>
    </div>
    <div class="stock-grid" id="stock-grid"></div>
  </section>
</main>

<!-- "How to embed" panel — shows exactly one line of code -->
<div id="embed-panel">
  <div class="embed-title" id="embed-title">Встраивание — одна строка</div>
  <pre class="embed-code" id="embed-code">&lt;script src="/agent.js"&gt;&lt;/script&gt;</pre>
  <button id="embed-btn" type="button">Встроить агента</button>
</div>

<div id="video-caption"></div>
<div id="fake-cursor"></div>

<div id="detail-modal" class="modal" aria-hidden="true">
  <div class="modal-card">
    <button class="modal-close" id="modal-close" type="button">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
